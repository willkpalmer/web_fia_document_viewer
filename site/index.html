<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Document Viewer</title>
<meta name="description" content="FIA Formula One decision documents, organised by event and document type.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23e10600'/><path d='M8 9h12v3h-8v3h7v3h-7v5H8z' fill='white'/></svg>">
</head>
<body>
<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Show events">☰</button>
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <h1>F1 Document Viewer</h1>
      <div class="sub" id="seasonLabel">Loading…</div>
    </div>
  </div>
  <div class="clock" id="clock" hidden title="Current local time at the track. Document times on this page are shown in track time.">
    <div class="clock-label">Track time</div>
    <div class="clock-time" id="clockTime">--:--:--</div>
    <div class="clock-sub"><span id="clockDay"></span> · <span id="clockWhere"></span></div>
  </div>
  <nav class="views">
    <a href="#/" id="navEvent" class="view-link">Events</a>
    <a href="#/penalties" id="navPen" class="view-link">Season penalties</a>
  </nav>
  <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">◐</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">Rounds</div>
    <ul id="eventList" class="event-list"></ul>
    <div class="side-foot" id="updated"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main id="main" class="main"><p class="muted">Loading…</p></main>
</div>

<script src="app.js"></script>
</body>
</html>
